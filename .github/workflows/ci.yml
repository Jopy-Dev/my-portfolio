name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  quality:
    name: Biome · Typecheck · Slop · Test
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install locked JavaScript dependencies
        run: npm ci --ignore-scripts
      - name: Install locked structural linter
        run: python -m pip install --disable-pip-version-check -r tools/requirements-quality.txt
      - name: Install locked asset test dependencies
        run: python -m pip install --disable-pip-version-check -r tools/requirements-assets.txt
      - name: Install structural linter system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fd-find ripgrep
          if ! command -v fd >/dev/null; then
            sudo ln -s "$(command -v fdfind)" /usr/local/bin/fd
          fi
          fd --version
          slop doctor
      - name: Verify registry signatures
        run: npm audit signatures
      - name: Audit locked dependencies
        run: npm audit --audit-level=high
      - name: Verify source quality
        run: |
          npm run ci
          npm run typecheck
          npm test
          python -m unittest scripts.assets.test_generate_approved_assets
          slop lint
      - name: Build static site
        env:
          SITE_URL: https://portfolio.example
          SITE_BASE_PATH: ''
          DEPLOY_ENV: development
        run: npm run build

  invariants:
    name: Env/invariant guards
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - name: Verify environment and design invariants
        run: |
          node scripts/quality/check-env-example.mjs
          node scripts/quality/check-design-tokens.mjs

  hidden-url-leak:
    name: Hidden URL leak guard
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - name: Verify public file boundary
        run: node scripts/quality/check-public-files.mjs

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
